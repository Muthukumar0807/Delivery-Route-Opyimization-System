<!doctype html>
<html><head><meta charset="utf-8"><title>Login - Delivery Route Optimization</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><div class="login-wrap"><form class="login" method="post">
<h1>Route Optimizer</h1><p>Dispatcher Login</p>
{% with msgs = get_flashed_messages() %}{% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}
<input name="username" placeholder="Username" required>
<input name="password" type="password" placeholder="Password" required>
<button class="btn" type="submit">Login</button>
<p class="muted" style="margin-top:12px">Demo: admin / admin123</p>
</form></div></body></html>
